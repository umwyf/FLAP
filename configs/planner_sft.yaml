# Planner supervised fine-tuning (Table 12).
base_model: Qwen/Qwen2.5-7B-Instruct
train_file: data/planner/train.jsonl
val_file: data/planner/val.jsonl
output_dir: checkpoints/flap-planner-7b

lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

learning_rate: 2.0e-5
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 16   # effective batch size 64 (adjust with #GPUs)
max_seq_length: 4096
warmup_ratio: 0.03
weight_decay: 0.01
lr_scheduler_type: cosine
bf16: true
gradient_checkpointing: true
logging_steps: 10
save_strategy: epoch
eval_strategy: epoch
seed: 42
merge_adapter: false
