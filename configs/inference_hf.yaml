# Same as inference.yaml but with the HuggingFace transformers backend
# (slower, no vLLM dependency). Useful for small models / debugging.
agent:
  backend: hf
  model: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
  max_batch_size: 8

planner:
  backend: hf
  model: Qwen/Qwen2.5-7B-Instruct
  adapter: checkpoints/flap-planner-7b
  dtype: bfloat16
  max_batch_size: 8
  generation:
    max_new_tokens: 1024
    temperature: 0.0

retriever:
  kind: http
  url: http://127.0.0.1:8000

execution:
  search_budget: 2
  top_k: 3
  max_passage_words: 256
  query_temperature: 0.7
  query_top_p: 0.95
  answer_temperature: 0.0
  check_temperature: 0.0
  max_new_tokens: 512
  max_context_tokens: 4096

eval:
  data_root: data
  datasets: [nq, hotpotqa]
  batch_size: 8
  output_dir: outputs/flap-0.5b
